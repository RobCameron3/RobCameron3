      type="translate"
      dur="10s"
      repeatCount="indefinite"
      calcMode="linear"
      keyTimes="0;.25;.4;.55;.7;1"
      values="
        1146 139;
        1146 139;
        1132 164;
        1119 194;
        1119 194;
        1119 194"/>
  </g>

  <!-- O3: LEFT CORNER, STATIONARY -->
  <g class="offense" transform="translate(895 112)">
    <text y="8">O</text>
  </g>

  <!-- O4: OFF-BALL SCREEN -->
  <g class="offense">
    <text y="8">O</text>

    <animateTransform
      attributeName="transform"
      type="translate"
      dur="10s"
      repeatCount="indefinite"
      calcMode="linear"
      keyTimes="0;.15;.28;.4;.55;.75;1"
      values="
        951 214;
        936 179;
        923 160;
        923 160;
        950 214;
        950 214;
        950 214"/>
  </g>

  <!-- X1: SCREENED DEFENDER -->
