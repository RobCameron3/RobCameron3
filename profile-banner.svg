<!-- SOLMETEX CODE -->
<g opacity="1">
  <animate attributeName="opacity"
    values="1;1;0;0;1"
    keyTimes="0;.495;.5;.995;1"
    dur="16s" repeatCount="indefinite"/>

  <text x="215" y="63" text-anchor="middle"
        font-family="monospace" font-size="12"
        fill="#a5e8ea">fuzzy_account_matcher.py</text>

  <g font-family="monospace" font-size="12.3"
     clip-path="url(#terminalClip)">

    <text x="37" y="104" fill="#6fe2af">
      # Parallel fuzzy matching
      <animate attributeName="opacity" values="0;1;1"
        keyTimes="0;.06;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="37" y="124" fill="#8be0e5" opacity="0">
      num_cores = cpu_count()
      <animate attributeName="opacity" values="0;0;1;1"
        keyTimes="0;.1;.15;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="37" y="144" fill="#f0c879" opacity="0">
      chunks = [
      <animate attributeName="opacity" values="0;0;1;1"
        keyTimes="0;.2;.25;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="37" y="164" fill="#ffffff" opacity="0">
      &#160;&#160;df.iloc[i:i+chunk_size]
      <animate attributeName="opacity" values="0;0;1;1"
        keyTimes="0;.3;.35;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="37" y="184" fill="#ffffff" opacity="0">
      &#160;&#160;for i in range(0,len(df),chunk_size)]
      <animate attributeName="opacity" values="0;0;1;1"
        keyTimes="0;.4;.45;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="37" y="204" fill="#f0c879" opacity="0">
      results = Parallel(n_jobs=num_cores)(
      <animate attributeName="opacity" values="0;0;1;1"
        keyTimes="0;.5;.55;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="37" y="224" fill="#ffffff" opacity="0">
      &#160;&#160;delayed(parallel_find_best_match)(
      <animate attributeName="opacity" values="0;0;1;1"
        keyTimes="0;.6;.65;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="37" y="244" fill="#ffffff" opacity="0">
      &#160;&#160;&#160;&#160;chunk, col, field, crm, 2)
      <animate attributeName="opacity" values="0;0;1;1"
        keyTimes="0;.7;.75;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="37" y="264" fill="#ffffff" opacity="0">
      &#160;&#160;for chunk in chunks)
      <animate attributeName="opacity" values="0;0;1;1"
        keyTimes="0;.8;.85;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="37" y="284" fill="#8be0e5" opacity="0">
      matches = pd.concat(results)
      <animate attributeName="opacity" values="0;0;1;1"
        keyTimes="0;.9;.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
</g>

