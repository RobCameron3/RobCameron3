<!-- TERMINAL -->
<rect x="18" y="38" width="326" height="274" rx="12" fill="#04121e" stroke="#48cdd5" stroke-width="1.7"/>
<circle cx="39" cy="58" r="4.5" fill="#f07575"/>
<circle cx="55" cy="58" r="4.5" fill="#e6be62"/>
<circle cx="71" cy="58" r="4.5" fill="#55d5a1"/>
<path d="M18 77H344" stroke="#48cdd5" opacity=".45"/>

<g>
  <animate attributeName="opacity" values="1;1;0;0;1"
    keyTimes="0;.499;.5;.999;1" dur="20s" repeatCount="indefinite"/>
  <text x="184" y="62" text-anchor="middle" class="mono" font-size="11" fill="#a5e8ea">fuzzy_account_matcher.py</text>
  <g class="code" xml:space="preserve">
    <text x="34" y="104" fill="#6fe2af"># Parallel fuzzy matching</text>
    <text x="34" y="124" fill="#8be0e5">num_cores = cpu_count()</text>
    <text x="34" y="144" fill="#f0c879">chunks = [</text>
    <text x="34" y="164" fill="#e9f3f7">  df.iloc[i:i+chunk_size]</text>
    <text x="34" y="184" fill="#e9f3f7">  for i in range(0,len(df),size)]</text>
    <text x="34" y="204" fill="#f0c879">results = Parallel(n_jobs=cores)(</text>
    <text x="34" y="224" fill="#e9f3f7">  delayed(find_best_match)(</text>
    <text x="34" y="244" fill="#e9f3f7">    chunk, col, field, crm, 2)</text>
    <text x="34" y="264" fill="#e9f3f7">  for chunk in chunks)</text>
    <text x="34" y="284" fill="#8be0e5">matches = pd.concat(results)</text>
  </g>
</g>

<g opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0"
    keyTimes="0;.499;.5;.999;1" dur="20s" repeatCount="indefinite"/>
  <text x="184" y="62" text-anchor="middle" class="mono" font-size="11" fill="#a5e8ea">nba_stats_scraper.py</text>
  <g class="code" xml:space="preserve">
    <text x="34" y="104" fill="#6fe2af"># Basketball Reference ETL</text>
    <text x="34" y="124" fill="#8be0e5">response = requests.get(</text>
    <text x="34" y="144" fill="#e9f3f7">  url, headers=headers)</text>
    <text x="34" y="164" fill="#f0c879">if response.status_code == 429:</text>
    <text x="34" y="184" fill="#e9f3f7">  time.sleep(120)</text>
    <text x="34" y="204" fill="#8be0e5">soup = BeautifulSoup(</text>
    <text x="34" y="224" fill="#e9f3f7">  response.text, "html.parser")</text>
    <text x="34" y="244" fill="#e9f3f7">table = soup.find("table")</text>
    <text x="34" y="264" fill="#8be0e5">df = pd.read_html(str(table))[0]</text>
    <text x="34" y="284" fill="#6fe2af"># Export player and team stats</text>
  </g>
</g>

