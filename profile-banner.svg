
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340"
     viewBox="0 0 1200 340"
     role="img"
     aria-label="Robert J. Cameron animated analytics portfolio">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#061421"/>
    <stop offset="1" stop-color="#12485b"/>
  </linearGradient>

  <clipPath id="terminalClip">
    <rect x="33" y="87" width="295" height="212"/>
  </clipPath>

  <clipPath id="courtClip">
    <rect x="872" y="78" width="302" height="221"/>
  </clipPath>
</defs>

<style>
  .mono {
    font-family: Consolas, Menlo, monospace;
  }

  .code {
    font-family: Consolas, Menlo, monospace;
    font-size: 10.8px;
  }

  .green { fill: #6fe2af; }
  .blue { fill: #8be0e5; }
  .gold { fill: #f0c879; }
  .white { fill: #e9f3f7; }

  .offense {
    fill: #6dead5;
    font-family: Arial, sans-serif;
    font-size: 22px;
    font-weight: bold;
    text-anchor: middle;
  }

  .defense {
    fill: #ffb17f;
    font-family: Arial, sans-serif;
    font-size: 22px;
    font-weight: bold;
    text-anchor: middle;
  }

  .route {
    fill: none;
    stroke: #6dead5;
    stroke-width: 1.8;
    stroke-dasharray: 4 6;
    opacity: .7;
  }

  .passRoute {
    fill: none;
    stroke: #ffc778;
    stroke-width: 2.3;
    stroke-dasharray: 5 6;
  }
</style>

<!-- BACKGROUND -->
<rect width="1200" height="340" fill="url(#bg)"/>

<g stroke="#61a9bd" stroke-width=".5" opacity=".1">
  <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200 M0 300H1200"/>
  <path d="M60 0V340 M120 0V340 M180 0V340 M240 0V340 M300 0V340 M360 0V340 M420 0V340 M480 0V340 M540 0V340 M600 0V340 M660 0V340 M720 0V340 M780 0V340 M840 0V340 M900 0V340 M960 0V340 M1020 0V340 M1080 0V340 M1140 0V340"/>
</g>

<!-- LEFT TERMINAL -->
<rect x="18" y="38" width="326" height="274"
      rx="12" fill="#04121e"
      stroke="#48cdd5" stroke-width="1.7"/>

<circle cx="39" cy="58" r="4.5" fill="#f07575"/>
<circle cx="55" cy="58" r="4.5" fill="#e6be62"/>
<circle cx="71" cy="58" r="4.5" fill="#55d5a1"/>

<path d="M18 77H344"
      stroke="#48cdd5" opacity=".45"/>

<!-- PROJECT 1: FUZZY ACCOUNT MATCHER -->
<g>
  <animate attributeName="opacity"
           values="1;1;0;0;1"
           keyTimes="0;.499;.5;.999;1"
           dur="20s"
           repeatCount="indefinite"/>

  <text x="184" y="62"
        text-anchor="middle"
        class="mono"
        font-size="11"
        fill="#a5e8ea">fuzzy_account_matcher.py</text>

  <clipPath id="s1"><rect x="34" y="90" height="18" width="0"><animate attributeName="width" values="0;285;285;0" keyTimes="0;.035;.499;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="s2"><rect x="34" y="110" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.035;.07;.499;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="s3"><rect x="34" y="130" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.07;.105;.499;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="s4"><rect x="34" y="150" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.105;.14;.499;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="s5"><rect x="34" y="170" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.14;.175;.499;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="s6"><rect x="34" y="190" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.175;.21;.499;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="s7"><rect x="34" y="210" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.21;.245;.499;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="s8"><rect x="34" y="230" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.245;.28;.499;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="s9"><rect x="34" y="250" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.28;.315;.499;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="s10"><rect x="34" y="270" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.315;.35;.499;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>

  <g class="code" xml:space="preserve"
     clip-path="url(#terminalClip)">
    <text x="34" y="104" class="green" clip-path="url(#s1)"># Parallel fuzzy matching</text>
    <text x="34" y="124" class="blue" clip-path="url(#s2)">num_cores = cpu_count()</text>
    <text x="34" y="144" class="gold" clip-path="url(#s3)">chunks = [</text>
    <text x="34" y="164" class="white" clip-path="url(#s4)">  df.iloc[i:i+chunk_size]</text>
    <text x="34" y="184" class="white" clip-path="url(#s5)">  for i in range(0,len(df),size)]</text>
    <text x="34" y="204" class="gold" clip-path="url(#s6)">results = Parallel(n_jobs=cores)(</text>
    <text x="34" y="224" class="white" clip-path="url(#s7)">  delayed(find_best_match)(</text>
    <text x="34" y="244" class="white" clip-path="url(#s8)">    chunk, col, field, crm, 2)</text>
    <text x="34" y="264" class="white" clip-path="url(#s9)">  for chunk in chunks)</text>
    <text x="34" y="284" class="blue" clip-path="url(#s10)">matches = pd.concat(results)</text>
  </g>
</g>

<!-- PROJECT 2: NBA SCRAPER -->
<g opacity="0">
  <animate attributeName="opacity"
           values="0;0;1;1;0"
           keyTimes="0;.499;.5;.999;1"
           dur="20s"
           repeatCount="indefinite"/>

  <text x="184" y="62"
        text-anchor="middle"
        class="mono"
        font-size="11"
        fill="#a5e8ea">nba_stats_scraper.py</text>

  <clipPath id="n1"><rect x="34" y="90" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.5;.535;.999;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="n2"><rect x="34" y="110" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.535;.57;.999;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="n3"><rect x="34" y="130" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.57;.605;.999;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="n4"><rect x="34" y="150" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.605;.64;.999;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="n5"><rect x="34" y="170" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.64;.675;.999;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="n6"><rect x="34" y="190" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.675;.71;.999;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="n7"><rect x="34" y="210" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.71;.745;.999;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="n8"><rect x="34" y="230" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.745;.78;.999;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="n9"><rect x="34" y="250" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.78;.815;.999;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="n10"><rect x="34" y="270" height="18" width="0"><animate attributeName="width" values="0;0;285;285;0" keyTimes="0;.815;.85;.999;1" dur="20s" repeatCount="indefinite"/></rect></clipPath>

  <g class="code" xml:space="preserve"
     clip-path="url(#terminalClip)">
    <text x="34" y="104" class="green" clip-path="url(#n1)"># Basketball Reference ETL</text>
    <text x="34" y="124" class="blue" clip-path="url(#n2)">response = requests.get(</text>
    <text x="34" y="144" class="white" clip-path="url(#n3)">  url, headers=headers)</text>
    <text x="34" y="164" class="gold" clip-path="url(#n4)">if response.status_code == 429:</text>
    <text x="34" y="184" class="white" clip-path="url(#n5)">  time.sleep(120)</text>
    <text x="34" y="204" class="blue" clip-path="url(#n6)">soup = BeautifulSoup(</text>
    <text x="34" y="224" class="white" clip-path="url(#n7)">  response.text, "html.parser")</text>
    <text x="34" y="244" class="white" clip-path="url(#n8)">table = soup.find("table")</text>
    <text x="34" y="264" class="blue" clip-path="url(#n9)">df = pd.read_html(str(table))[0]</text>
    <text x="34" y="284" class="green" clip-path="url(#n10)"># Export player and team stats</text>
  </g>
</g>

<!-- CENTER PROFILE -->
<rect x="365" y="93" width="478" height="154"
