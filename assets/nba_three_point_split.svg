
<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="500"
     viewBox="0 0 1100 500">

<title>The Rise of the Three-Point Shot</title>
<desc>
Animated NBA three-point shot visualization.
Historical attempts per team per game from 2000-01
through 2025-26, with provisional 2026-27 data.
Shot locations are illustrative.
</desc>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#091321"/>
    <stop offset="100%" stop-color="#14283d"/>
  </linearGradient>

  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#192b40"/>
    <stop offset="100%" stop-color="#101c2e"/>
  </linearGradient>

  <clipPath id="chartReveal">
    <rect x="520" y="115" width="0" height="300">
      <animate
        attributeName="width"
        values="0;340;340;0"
        keyTimes="0;0.88;0.96;1"
        dur="8s"
        repeatCount="indefinite"/>
    </rect>
  </clipPath>
</defs>

<style>
  text {
    font-family: Arial, Helvetica, sans-serif;
  }

  .heading {
    fill: #ffffff;
    font-size: 26px;
    font-weight: 700;
  }

  .subtitle {
    fill: #9fb1c6;
    font-size: 13px;
  }

  .paneltitle {
    fill: #eaf2fb;
    font-size: 16px;
    font-weight: 700;
  }

  .courtline {
    fill: none;
    stroke: #8296ad;
    stroke-width: 2;
  }

  .arc {
    fill: none;
    stroke: #fbbf24;
    stroke-width: 3;
  }

  .grid {
    stroke: #64748b;
    stroke-width: 1;
    stroke-dasharray: 5 6;
    opacity: 0.55;
  }

  .shot {
    fill: #fbbf24;
    stroke: #fff0b3;
    stroke-width: 0.7;
    opacity: 0;
    animation: shotAppear 8s linear infinite;
  }

  @keyframes shotAppear {
    0% { opacity: 0; }
    1% { opacity: 1; }
    95% { opacity: 1; }
    100% { opacity: 0; }
  }

  .initial {
    fill: #fbbf24;
    stroke: #fff0b3;
    stroke-width: 0.7;
    opacity: 1;
  }

  .trend {
    fill: none;
    stroke: #fbbf24;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .point {
    fill: #fbbf24;
    stroke: #ffe8a3;
    stroke-width: 1;
  }

  .axislabel {
    fill: #fbbf24;
    font-size: 13px;
  }

  .season {
    fill: #cbd5e1;
    font-size: 11px;
  }
</style>

<!-- BACKGROUND -->
<rect width="1100" height="500"
      rx="16" fill="url(#background)"/>

<!-- HEADER -->
<text x="30" y="43" class="heading">
  THE RISE OF THE THREE-POINT SHOT
</text>

<text x="30" y="67" class="subtitle">
  NBA three-point shooting evolution | 2000-01 to 2026-27
</text>

<!-- PANELS -->
<rect x="20" y="85" width="480" height="370"
      rx="12" fill="url(#panel)" stroke="#344860"/>

<rect x="510" y="85" width="570" height="370"
      rx="12" fill="url(#panel)" stroke="#344860"/>

<!-- ===================================== -->
<!-- LEFT: BASKETBALL SHOT DISTRIBUTION     -->
<!-- ===================================== -->

<text x="40" y="115" class="paneltitle">
  Three-Point Shot Distribution
</text>

<!-- Half court -->
<g class="courtline">

  <rect x="70" y="140" width="380" height="285"/>

  <!-- Painted area -->
  <rect x="210" y="140" width="100" height="105"/>

  <!-- Free throw circle -->
  <circle cx="260" cy="245" r="50"
          stroke-dasharray="5 5"/>

  <!-- Backboard -->
  <line x1="235" y1="155" x2="285" y2="155"
        stroke="#fb923c" stroke-width="3"/>

  <!-- Basket -->
  <circle cx="260" cy="168" r="7"
          stroke="#fb923c" stroke-width="2.5"/>

</g>

<!-- Three-point boundary:
     Basket centered at (260,168).
     Curved boundary radius 151.
     Shots must be beyond this boundary. -->

<path
  d="M109 140
     L109 168
     A151 151 0 0 0 411 168
     L411 140"
  class="arc"/>

<!-- Corner three-point locations -->
<g class="initial">
  <circle cx="94" cy="151" r="3.1"/>
  <circle cx="95" cy="163" r="3.1"/>
  <circle cx="426" cy="151" r="3.1"/>
  <circle cx="425" cy="163" r="3.1"/>
</g>

<!-- Initial six perimeter shots -->
<g class="initial">
  <circle cx="106" cy="219" r="3.1"/>
  <circle cx="143" cy="288" r="3.1"/>
  <circle cx="220" cy="331" r="3.1"/>
  <circle cx="300" cy="331" r="3.1"/>
  <circle cx="377" cy="288" r="3.1"/>
  <circle cx="414" cy="219" r="3.1"/>
</g>

<!--
Additional shots appear individually.
All positions are beyond the 151-unit
three-point radius from the basket.
Each shot has its own animation delay.
-->

<g>
