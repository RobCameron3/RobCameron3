
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
<defs>
  <linearGradient id="bg" x2="0" y2="1">
    <stop stop-color="#091522"/>
    <stop offset="1" stop-color="#14263b"/>
  </linearGradient>
  <radialGradient id="ball">
    <stop stop-color="#ffc16b"/>
    <stop offset="1" stop-color="#e47b29"/>
  </radialGradient>
  <g id="basketball">
    <circle r="11" fill="url(#ball)" stroke="#ffd195" stroke-width="1.2"/>
    <path d="M-11 0H11M0 -11V11M-8 -8Q6 0 -8 8M8 -8Q-6 0 8 8" stroke="#793c18" stroke-width="1.3" fill="none"/>
  </g>
  <g id="hoop">
    <rect x="-12" y="-35" width="32" height="27" rx="2" fill="none" stroke="#e2eaf3" stroke-width="3"/>
    <path d="M-22 -5H12" stroke="#ff9250" stroke-width="4" stroke-linecap="round"/>
    <path d="M-20 0L-14 20H4L10 0M-11 0L-5 20M1 0L-5 20" fill="none" stroke="#c3d4e3" stroke-width="1.6"/>
  </g>
  <style>
    text {font-family:Arial,Helvetica,sans-serif}
    .title {font-size:32px;font-weight:800;fill:#f5f8fc}
    .subtitle {font-size:14px;fill:#9fb5ca}
    .heading {font-size:20px;font-weight:800;fill:#f1f6fb}
    .description {font-size:13px;fill:#a9bed0}
    .formula {font-size:15px;font-weight:700;fill:#e6eff7}
    .value {font-size:23px;font-weight:800}
    .small {font-size:12px;fill:#9cb3c6}
    .card {fill:#15283d;stroke:#2d465d;stroke-width:1.4}
    .blue {fill:#56b3ff}
    .orange {fill:#ffab63}
    .barA {fill:#56b3ff;animation:grow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:left}
    .barB {fill:#ffab63;animation:grow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:left}
    @keyframes grow {
      0%,8% {transform:scaleX(0)}
      42%,88% {transform:scaleX(1)}
      100% {transform:scaleX(0)}
    }
  </style>
</defs>

<rect width="1200" height="850" rx="20" fill="url(#bg)"/>

<!-- HEADER -->
<text x="40" y="48" class="title">NBA FOUR FACTORS</text>
<text x="41" y="73" class="subtitle">Animated Team A vs Team B basketball performance comparison</text>
<rect x="40" y="91" width="1120" height="1" fill="#34516a"/>

<circle cx="50" cy="119" r="7" fill="#56b3ff"/>
<text x="66" y="124" fill="#e5f2ff" font-size="14" font-weight="700">TEAM A</text>
<circle cx="185" cy="119" r="7" fill="#ffab63"/>
<text x="201" y="124" fill="#e5f2ff" font-size="14" font-weight="700">TEAM B</text>
<text x="1158" y="124" text-anchor="end" class="small">ILLUSTRATIVE VALUES — NOT REAL TEAM DATA</text>

<!-- METRIC 1 -->
<g transform="translate(40 143)">
  <rect width="1120" height="158" rx="14" class="card"/>
  <rect width="5" height="158" rx="2" fill="#61dec9"/>

  <text x="24" y="32" class="heading">01  Effective Field Goal Percentage</text>
  <text x="24" y="53" class="description">A made three-pointer receives extra credit for its higher point value.</text>

  <g transform="translate(30 64)">
    <use href="#hoop" transform="translate(232 32)"/>
    <g>
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M25 70 Q115 -70 232 25 L232 58"/>
      <use href="#basketball"/>
    </g>
    <text x="284" y="21" fill="#61dec9" font-size="14" font-weight="700">3PT SHOT</text>
    <text x="284" y="42" class="small">3PM adds 0.5</text>
    <text x="284" y="58" class="small">to the numerator</text>
  </g>

  <text x="515" y="33" class="formula">eFG% = (FGM + 0.5 × 3PM) / FGA</text>
  <text x="515" y="68" class="value blue">55.2%</text>
  <text x="1067" y="68" class="value orange" text-anchor="end">52.1%</text>

  <rect x="515" y="84" width="550" height="10" rx="5" fill="#2b3d50"/>
  <rect x="515" y="84" width="506" height="10" rx="5" class="barA"/>
  <rect x="515" y="102" width="550" height="10" rx="5" fill="#2b3d50"/>
  <rect x="515" y="102" width="477" height="10" rx="5" class="barB"/>
  <text x="515" y="135" fill="#72e3cf" font-size="13" font-weight="700">TEAM A LEADS — HIGHER IS BETTER</text>
</g>

<!-- METRIC 2 -->
<g transform="translate(40 316)">
  <rect width="1120" height="158" rx="14" class="card"/>
  <rect width="5" height="158" rx="2" fill="#7fb9ff"/>

  <text x="24" y="32" class="heading">02  Turnover Percentage</text>
  <text x="24" y="53" class="description">A lost ball ends the possession without producing a shot attempt.</text>

  <g transform="translate(30 66)">
    <circle cx="45" cy="41" r="23" fill="#194b72" stroke="#68b7ef" stroke-width="2"/>
    <text x="45" y="47" text-anchor="middle" fill="white" font-size="17" font-weight="700">A</text>
    <circle cx="240" cy="41" r="23" fill="#633e32" stroke="#ffae7a" stroke-width="2"/>
    <text x="240" y="47" text-anchor="middle" fill="white" font-size="17" font-weight="700">B</text>
    <g>
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M70 38 Q145 -38 214 38"/>
      <use href="#basketball"/>
    </g>
    <text x="285" y="30" fill="#7fb9ff" font-size="14" font-weight="700">STEAL</text>
    <text x="285" y="49" class="small">Possession lost</text>
  </g>

  <text x="515" y="33" class="formula">TOV% = TOV / (FGA + 0.44 × FTA + TOV)</text>
  <text x="515" y="68" class="value blue">12.4%</text>
  <text x="1067" y="68" class="value orange" text-anchor="end">14.1%</text>

  <rect x="515" y="84" width="550" height="10" rx="5" fill="#2b3d50"/>
  <rect x="515" y="84" width="484" height="10" rx="5" class="barA"/>
  <rect x="515" y="102" width="550" height="10" rx="5" fill="#2b3d50"/>
  <rect x="515" y="102" width="550" height="10" rx="5" class="barB"/>
  <text x="515" y="135" fill="#72e3cf" font-size="13" font-weight="700">TEAM A LEADS — LOWER IS BETTER</text>
</g>

<!-- METRIC 3 -->
<g transform="translate(40 489)">
  <rect width="1120" height="158" rx="14" class="card"/>
  <rect width="5" height="158" rx="2" fill="#c7a4ff"/>

  <text x="24" y="32" class="heading">03  Offensive Rebound Percentage</text>
  <text x="24" y="53" class="description">Recovering a missed shot creates a second-chance possession.</text>

  <g transform="translate(30 65)">
    <use href="#hoop" transform="translate(232 33)"/>
    <g>
      <animateMotion dur="4s" repeatCount="indefinite" path="M25 70 Q110 -58 231 26 Q255 43 208 67 Q155 88 130 56"/>
      <use href="#basketball"/>
    </g>
    <text x="284" y="22" fill="#c7a4ff" font-size="14" font-weight="700">MISSED SHOT</text>
    <text x="284" y="42" class="small">Offense recovers</text>
    <text x="284" y="58" class="small">the rebound</text>
  </g>

  <text x="515" y="33" class="formula">ORB% = ORB / (ORB + Opp DRB)</text>
  <text x="515" y="68" class="value blue">28.6%</text>
  <text x="1067" y="68" class="value orange" text-anchor="end">31.2%</text>

  <rect x="515" y="84" width="550" height="10" rx="5" fill="#2b3d50"/>
  <rect x="515" y="84" width="504" height="10" rx="5" class="barA"/>
  <rect x="515" y="102" width="550" height="10" rx="5" fill="#2b3d50"/>
  <rect x="515" y="102" width="550" height="10" rx="5" class="barB"/>
  <text x="515" y="135" fill="#ffbe8d" font-size="13" font-weight="700">TEAM B LEADS — HIGHER IS BETTER</text>
</g>

<!-- METRIC 4 -->
<g transform="translate(40 662)">
  <rect width="1120" height="158" rx="14" class="card"/>
  <rect width="5" height="158" rx="2" fill="#ffce75"/>

  <text x="24" y="32" class="heading">04  Free Throw Rate</text>
  <text x="24" y="53" class="description">Made free throws relative to field-goal attempts.</text>

  <g transform="translate(30 64)">
    <use href="#hoop" transform="translate(232 32)"/>
    <g>
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M40 70 Q130 -60 232 25 L232 58"/>
      <use href="#basketball"/>
    </g>
    <text x="284" y="22" fill="#ffce75" font-size="14" font-weight="700">FREE THROW</text>
    <text x="284" y="42" class="small">Made FT = 1 point</text>
    <text x="284" y="58" class="small">FTM / FGA</text>
  </g>

  <text x="515" y="33" class="formula">FT/FGA = FTM / FGA</text>
  <text x="515" y="68" class="value blue">19.8%</text>
  <text x="1067" y="68" class="value orange" text-anchor="end">17.5%</text>

  <rect x="515" y="84" width="550" height="10" rx="5" fill="#2b3d50"/>
  <rect x="515" y="84" width="550" height="10" rx="5" class="barA"/>
  <rect x="515" y="102" width="550" height="10" rx="5" fill="#2b3d50"/>
  <rect x="515" y="102" width="486" height="10" rx="5" class="barB"/>
  <text x="515" y="135" fill="#72e3cf" font-size="13" font-weight="700">TEAM A LEADS — HIGHER IS BETTER</text>
</g>
</svg>

