<text x="260" y="447"
      text-anchor="middle"
      fill="#8fa5ba"
      font-size="11">
  Illustrative shot locations outside the 3PT arc
</text>

<!-- ===================================== -->
<!-- RIGHT: HISTORICAL THREE-POINT ATTEMPTS -->
<!-- ===================================== -->

<text x="530" y="115" class="paneltitle">
  Three-Point Attempts Per Game
</text>

<!--
Chart coordinates:
X = 530 + season_index * 12.5
Y = 395 - 6.25 * attempts

Y-axis: 0 to 40 attempts.
Data supplied by user.
-->

<!-- Grid -->
<g class="grid">
  <line x1="530" y1="395" x2="855" y2="395"/>
  <line x1="530" y1="363.75" x2="855" y2="363.75"/>
  <line x1="530" y1="332.5" x2="855" y2="332.5"/>
  <line x1="530" y1="301.25" x2="855" y2="301.25"/>
  <line x1="530" y1="270" x2="855" y2="270"/>
  <line x1="530" y1="238.75" x2="855" y2="238.75"/>
  <line x1="530" y1="207.5" x2="855" y2="207.5"/>
  <line x1="530" y1="176.25" x2="855" y2="176.25"/>
  <line x1="530" y1="145" x2="855" y2="145"/>
</g>

<!-- Right-side Y axis -->
<line x1="855" y1="145" x2="855" y2="395"
      stroke="#aab4c2" stroke-width="1.5"/>

<!-- Right-side values -->
<g class="axislabel">
  <text x="865" y="399">0</text>
  <text x="865" y="368">5</text>
  <text x="865" y="337">10</text>
  <text x="865" y="306">15</text>
  <text x="865" y="275">20</text>
  <text x="865" y="244">25</text>
  <text x="865" y="212">30</text>
  <text x="865" y="181">35</text>
  <text x="865" y="150">40</text>
</g>

<!-- Axis title to the right of values -->
<text x="905" y="257"
      fill="#fbbf24"
      font-size="16"
      font-weight="bold">
  <tspan x="905">3PT shots</tspan>
  <tspan x="905" dy="23">attempted</tspan>
  <tspan x="905" dy="23">per game</tspan>
</text>

<!-- X axis seasons -->
<g class="season" text-anchor="middle">
  <text x="530" y="416">2000-01</text>
  <text x="592.5" y="416">2005-06</text>
  <text x="655" y="416">2010-11</text>
  <text x="717.5" y="416">2015-16</text>
  <text x="780" y="416">2020-21</text>
  <text x="842.5" y="416">2025-26</text>
</g>

<!-- Actual supplied season values -->
<!-- 2000-01 through 2025-26 -->
<g clip-path="url(#chartReveal)">

  <polyline class="trend"
