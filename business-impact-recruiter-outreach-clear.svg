
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="365" viewBox="0 0 1000 365"
     role="img"
     aria-label="Customer identification optimization and business impact">

  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      fill: #202b37;
    }

    .label {
      font-size: 12px;
      font-weight: 800;
      fill: #21475b;
    }

    .small {
      font-size: 12px;
      fill: #526678;
    }

    .card {
      fill: #ffffff;
      stroke: #cddae4;
      stroke-width: 1.5;
    }

    .blue-bar, .green-bar {
      transform-box: fill-box;
      transform-origin: left center;
    }

    .blue-bar {
      animation: blueGrow 8s infinite;
    }

    .green-bar {
      animation: greenGrow 8s infinite;
    }

    @keyframes blueGrow {
      0% { transform: scaleX(0); }
      12%, 94% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }

    @keyframes greenGrow {
      0%, 12% { transform: scaleX(0); }
      27%, 94% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }

    @keyframes person1 {
      0%, 14% { opacity: 0; }
      18%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes person2 {
      0%, 19% { opacity: 0; }
      23%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes person3 {
      0%, 24% { opacity: 0; }
      28%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes money0 {
      0%, 10% { opacity: 1; }
      10.1%, 100% { opacity: 0; }
    }

    @keyframes money1 {
      0%, 9.9% { opacity: 0; }
      10.1%, 17% { opacity: 1; }
      17.1%, 100% { opacity: 0; }
    }

    @keyframes money2 {
      0%, 16.9% { opacity: 0; }
      17.1%, 24% { opacity: 1; }
      24.1%, 100% { opacity: 0; }
    }

    @keyframes money3 {
      0%, 23.9% { opacity: 0; }
      24.1%, 31% { opacity: 1; }
      31.1%, 100% { opacity: 0; }
    }

    @keyframes money4 {
      0%, 30.9% { opacity: 0; }
      31.1%, 94% { opacity: 1; }
      94.1%, 100% { opacity: 0; }
    }

    @keyframes stack1 {
      0%, 10% { opacity: 0; }
      12%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes stack2 {
      0%, 16% { opacity: 0; }
      19%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes stack3 {
      0%, 22% { opacity: 0; }
      27%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes stack4 {
      0%, 28% { opacity: 0; }
      34%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>

  <defs>
    <!-- DOLLAR BILL -->
    <g id="dollar-bill">
      <rect width="29" height="14" rx="2"
            fill="#168c68" stroke="#08684e"/>
      <rect x="3" y="2" width="23" height="10" rx="2"
            fill="none" stroke="#b8e5cd" stroke-width=".7"/>
      <text x="14.5" y="10.5"
            font-size="9" font-weight="bold"
            text-anchor="middle" fill="#ffffff">$</text>
    </g>

    <!-- CUSTOMER SILHOUETTE -->
    <g id="customer-person" fill="#2d9dbe">
      <circle r="7"/>
      <path d="M-11 26 Q-11 11 0 11 Q11 11 11 26Z"/>
    </g>

    <!-- ARROWHEAD ATTACHED TO THE TREND PATH -->
    <marker id="trend-arrow"
            viewBox="0 0 12 12"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="6"
            orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M1 1 L10 6 L1 11"
            fill="none"
            stroke="#15966b"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1000" height="365" rx="13" fill="#ffffff"/>
  <rect x="9" y="9" width="982" height="347" rx="12"
        fill="#ffffff" stroke="#d3dfe8"/>

  <!-- HEADER -->
  <text x="28" y="38" class="title">
    CUSTOMER IDENTIFICATION OPTIMIZATION
  </text>
  <text x="28" y="57" class="small">
    From cleaner customer data to actionable sales opportunities
  </text>

  <!-- IDENTIFICATION CARD -->
  <rect x="25" y="72" width="580" height="110"
        rx="10" class="card"/>

  <text x="41" y="94" class="label">
    IDENTIFICATION RATE
  </text>

  <!-- BEFORE: 60% -->
  <text x="41" y="118" class="small">Before</text>
  <text x="108" y="118"
        font-size="14" font-weight="bold"
        fill="#397ba4">60%</text>

  <rect x="155" y="106" width="245" height="13"
        rx="6" fill="#e6edf2"/>
  <rect class="blue-bar"
        x="155" y="106" width="147" height="13"
        rx="6" fill="#5ca4cf"/>

  <!-- AFTER: 90% -->
  <text x="41" y="145" class="small">After</text>
  <text x="108" y="145"
        font-size="14" font-weight="bold"
        fill="#0b956e">90%</text>

  <rect x="155" y="133" width="245" height="13"
        rx="6" fill="#e6edf2"/>
  <rect class="green-bar"
        x="155" y="133" width="220.5" height="13"
        rx="6" fill="#20a27d"/>

  <!-- +50% IMPROVEMENT -->
  <rect x="418" y="91" width="167" height="72"
        rx="9" fill="#e9f7f0"/>

  <text x="501" y="123"
        font-size="31" font-weight="bold"
        fill="#07865d" text-anchor="middle">+50%</text>

  <text x="501" y="142"
        font-size="11" font-weight="bold"
        fill="#21674e" text-anchor="middle">
    HIGHER RATE
  </text>

  <text x="41" y="168" font-size="11" fill="#526678">
    60% → 90% = +30 percentage points (50% higher than before)
  </text>

  <!-- FINANCIAL CARD -->
  <rect x="618" y="72" width="357" height="110"
        rx="10" class="card"/>

  <text x="634" y="94" class="label">
    ESTIMATED ANNUAL COST SAVINGS
  </text>

  <!-- ANIMATED DOLLAR AMOUNTS -->
  <g font-size="30" font-weight="800" fill="#167b5c">
    <text x="634" y="141"
          style="animation:money0 8s infinite">$0</text>

    <text x="634" y="141"
          style="animation:money1 8s infinite;opacity:0">$28,500</text>

    <text x="634" y="141"
          style="animation:money2 8s infinite;opacity:0">$57,000</text>

    <text x="634" y="141"
          style="animation:money3 8s infinite;opacity:0">$85,500</text>

    <text x="634" y="141"
          style="animation:money4 8s infinite;opacity:0">$114,000</text>
  </g>

  <!-- ASCENDING MONEY STACKS -->
  <!-- Kept on the right side of the card. -->

  <g style="animation:stack1 8s infinite;opacity:0">
    <use href="#dollar-bill" x="825" y="155"/>
  </g>

  <g style="animation:stack2 8s infinite;opacity:0">
    <use href="#dollar-bill" x="859" y="155"/>
    <use href="#dollar-bill" x="859" y="138"/>
  </g>

  <g style="animation:stack3 8s infinite;opacity:0">
    <use href="#dollar-bill" x="893" y="155"/>
    <use href="#dollar-bill" x="893" y="138"/>
    <use href="#dollar-bill" x="893" y="121"/>
  </g>

  <g style="animation:stack4 8s infinite;opacity:0">
    <use href="#dollar-bill" x="927" y="155"/>
    <use href="#dollar-bill" x="927" y="138"/>
    <use href="#dollar-bill" x="927" y="121"/>
    <use href="#dollar-bill" x="927" y="104"/>
  </g>

  <!-- SHORT DISCLAIMER, CLEAR OF MONEY STACKS -->
  <text x="634" y="174" font-size="10" fill="#607586">
    Estimate; not audited net savings
  </text>

  <!-- BUSINESS IMPACT FLOW -->
  <text x="28" y="212" class="label">
    HOW BETTER CUSTOMER IDENTIFICATION CREATES BUSINESS VALUE
  </text>

  <!-- STAGE 1: IDENTIFICATION -->
  <rect x="25" y="224" width="208" height="111"
        rx="9" fill="#f8fbfd" stroke="#cbdde8"/>

  <text x="129" y="244"
        font-size="11" font-weight="bold"
        fill="#286077" text-anchor="middle">
    CUSTOMER IDENTIFICATION
  </text>

  <text x="129" y="283"
        font-size="24" font-weight="bold"
        fill="#0a936d" text-anchor="middle">
    60% → 90%
  </text>

  <text x="129" y="321"
        font-size="11" fill="#566b7b"
        text-anchor="middle">
    More customers identified
  </text>

  <!-- CONNECTOR -->
  <path d="M241 277 h15 m-6 -6 l6 6 -6 6"
        fill="none" stroke="#0b9caf" stroke-width="2.5"/>

  <!-- STAGE 2: CRM -->
  <rect x="264" y="224" width="219" height="111"
        rx="9" fill="#f8fbfd" stroke="#cbdde8"/>

  <text x="373.5" y="244"
        font-size="11" font-weight="bold"
        fill="#286077" text-anchor="middle">
    ACTIONABLE CRM DATA
  </text>

  <!-- THREE PEOPLE APPEAR ONE AT A TIME -->
  <g style="animation:person1 8s infinite;opacity:0">
    <use href="#customer-person" x="328" y="271"/>
  </g>

  <g style="animation:person2 8s infinite;opacity:0">
    <use href="#customer-person" x="373" y="271"/>
  </g>

  <g style="animation:person3 8s infinite;opacity:0">
    <use href="#customer-person" x="418" y="271"/>
  </g>

  <text x="373.5" y="321"
        font-size="11" fill="#566b7b"
        text-anchor="middle">
    More identifiable accounts
  </text>

  <!-- CONNECTOR -->
  <path d="M491 277 h15 m-6 -6 l6 6 -6 6"
        fill="none" stroke="#0b9caf" stroke-width="2.5"/>

  <!-- STAGE 3: OUTREACH -->
  <rect x="503" y="224" width="219" height="111"
        rx="9" fill="#f8fbfd" stroke="#cbdde8"/>

  <text x="612.5" y="244"
        font-size="11" font-weight="bold"
        fill="#286077" text-anchor="middle">
    TARGETED OUTREACH
  </text>

  <!-- EMAIL ICON -->
  <g stroke="#087fa4" stroke-width="3"
     fill="none" stroke-linejoin="round"
     stroke-linecap="round">

    <rect x="548" y="256" width="51" height="34"
          rx="5" fill="#e0f4fa"/>

    <path d="M551 260 L573.5 277 L596 260"/>
  </g>

  <!-- TARGET ICON -->
  <g stroke="#087fa4" stroke-width="3"
     fill="none" stroke-linejoin="round"
     stroke-linecap="round">

    <circle cx="654" cy="272" r="20" fill="#e0f4fa"/>
    <circle cx="654" cy="272" r="11"/>
    <circle cx="654" cy="272" r="3.5"
            fill="#087fa4" stroke="none"/>

    <path d="M654 272 L672 254 M664 254 H672 V262"
          stroke="#168a65" stroke-width="3.5"/>
  </g>

  <text x="573.5" y="310"
        font-size="11.5" font-weight="bold"
        fill="#23566c" text-anchor="middle">
    EMAIL
  </text>

  <text x="654" y="310"
        font-size="11.5" font-weight="bold"
        fill="#23566c" text-anchor="middle">
    TARGETING
  </text>

  <text x="612.5" y="325"
        font-size="10.5" fill="#566b7b"
        text-anchor="middle">
    More targeted customer outreach
  </text>

  <!-- CONNECTOR -->
  <path d="M730 277 h15 m-6 -6 l6 6 -6 6"
        fill="none" stroke="#0b9caf" stroke-width="2.5"/>

  <!-- STAGE 4: REVENUE OPPORTUNITIES -->
  <rect x="742" y="224" width="233" height="111"
        rx="9" fill="#eaf8f2" stroke="#93cfb5"/>

  <text x="858.5" y="244"
        font-size="11" font-weight="bold"
        fill="#167b59" text-anchor="middle">
    REVENUE OPPORTUNITIES
  </text>

  <!-- CONNECTED ANIMATED REVENUE TREND -->
  <!-- The arrowhead is a marker on the same path. -->
  <!-- As the path extends, the marker moves with its endpoint. -->

  <path
    d="M786 297 L786 297 L786 297 L786 297 L786 297"
    fill="none"
    stroke="#15966b"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    marker-end="url(#trend-arrow)">

    <animate
      attributeName="opacity"
      dur="8s"
      repeatCount="indefinite"
      values="0;0;1;1;0"
      keyTimes="0;0.22;0.225;0.94;1"/>

    <animate
      attributeName="d"
      dur="8s"
      repeatCount="indefinite"
      calcMode="linear"
      keyTimes="0;0.22;0.28;0.34;0.40;0.46;0.94;1"
      values="
        M786 297 L786 297 L786 297 L786 297 L786 297;
        M786 297 L786 297 L786 297 L786 297 L786 297;
        M786 297 L822 283 L822 283 L822 283 L822 283;
        M786 297 L822 283 L854 287 L854 287 L854 287;
        M786 297 L822 283 L854 287 L890 266 L890 266;
        M786 297 L822 283 L854 287 L890 266 L921 256;
        M786 297 L822 283 L854 287 L890 266 L921 256;
        M786 297 L786 297 L786 297 L786 297 L786 297"/>
  </path>

  <text x="858.5" y="321"
        font-size="11" fill="#566b7b"
        text-anchor="middle">
    Potential repeat sales
  </text>

</svg>
